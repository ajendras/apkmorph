[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apkmorph"
version = "0.1.0"
description = "Natural-language AI tool that analyzes APKs and generates intelligent patches from plain-English descriptions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "APK Morph Contributors"}]
dependencies = [
  "streamlit>=1.29.0",
  "ollama>=0.2.1",
  "typer[all]>=0.9.0",
  "androguard>=4.1.0",
  "pydantic>=2.5.0",
  "rich>=13.7.0",
  "frida>=16.4.0",
]

[project.scripts]
apkmorph = "apkmorph.cli:app"

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-cov>=4.0.0"]
dev = ["black>=24.0.0", "ruff>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["apkmorph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=no"

[tool.ruff]
line-length = 100
target-version = "py310"
